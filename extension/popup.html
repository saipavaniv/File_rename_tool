<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Hop</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <span class="bunny" aria-hidden="true">🐇</span>
    <b>Hop</b>
    <span class="sp"></span>
    <button class="link" id="settings" title="Settings">Settings</button>
  </header>

  <div id="setup" class="empty hidden">
    <div class="big-bunny" aria-hidden="true">🐇</div>
    <b>Let's connect Hop</b>
    <p id="setupMsg">One click, then press <strong>Allow</strong> in the tab that opens.</p>
    <button class="primary big" id="connect">Connect</button>
    <p class="hint" id="setupHint"></p>
  </div>

  <div id="main" class="hidden">
    <div class="status" id="status">Looking for files on this page…</div>
    <div class="bar"><i id="progress"></i></div>
    <div id="access" class="access hidden"></div>
    <ul id="list"></ul>
    <div id="none" class="empty hidden">
      <b>No files on this page</b>
      Open the page or email with the attachments, then click 🐇 again. Tip: right-click any link → <i>Rename &amp; download with Hop</i>.
    </div>
    <footer>
      <button id="again">Scan again</button>
      <button id="retry" class="hidden">Retry failed</button>
      <span class="sp"></span>
      <button class="link" id="site">Open Hop</button>
    </footer>
  </div>
  <script src="popup.js"></script>
</body>
</html>
