<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Sign in · Hop</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <div class="login-wrap">
    <form class="card login-card" id="form" autocomplete="on" novalidate>
      <div id="brand"></div>
      <h1>Sign in</h1>
      <p class="muted small">Welcome back 🐇</p>
      <div id="err" class="alert bad hidden" role="alert"></div>
      <div class="field">
        <label for="u">Username</label>
        <input type="text" id="u" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required maxlength="64" autofocus>
      </div>
      <div class="field">
        <label for="p">Password</label>
        <input type="password" id="p" name="password" autocomplete="current-password" required maxlength="128">
      </div>
      <button class="primary" type="submit" id="go">Sign in</button>
      <p class="muted small" id="note"></p>
    </form>
  </div>
  <script src="/static/common.js"></script>
  <script src="/static/login.js"></script>
</body>
</html>
